[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/web",
  "apps/desktop",
  "apps/mobile",
  "apps/worker",
  "apps/admin-cli",
  "crates/platform-core",
  "crates/contracts",
  "crates/domain",
  "crates/application",
  "crates/auth",
  "crates/tenancy",
  "crates/audit",
  "crates/billing",
  "crates/i18n",
  "crates/persistence",
  "crates/storage",
  "crates/jobs",
  "crates/sync",
  "crates/api-client",
  "crates/ai",
  "crates/plugins",
  "crates/ui",
  "crates/infrastructure",
  "crates/cache",
  "crates/rate-limit",
  "crates/backup",
  "templates/ferrugen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ferrugen/ferrugen"
authors = ["Ferrugen Contributors"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dioxus = { version = "0.7", default-features = false }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jobs = { path = "crates/jobs" }
platform-core = { path = "crates/platform-core" }
domain = { path = "crates/domain" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
validator = { version = "0.18", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
utoipa = { version = "4", features = ["axum", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
email_address = "0.2"
subtle = "2"
zeroize = "1.7"
proptest = "1"
rstest = "0.23"
wiremock = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
ai = { path = "crates/ai" }
api-client = { path = "crates/api-client" }
application = { path = "crates/application" }
audit = { path = "crates/audit" }
auth = { path = "crates/auth" }
backup = { path = "crates/backup" }
billing = { path = "crates/billing" }
cache = { path = "crates/cache" }
contracts = { path = "crates/contracts" }
i18n = { path = "crates/i18n" }
infrastructure = { path = "crates/infrastructure" }
persistence = { path = "crates/persistence" }
plugins = { path = "crates/plugins" }
rate-limit = { path = "crates/rate-limit" }
storage = { path = "crates/storage" }
sync = { path = "crates/sync" }
tenancy = { path = "crates/tenancy" }
ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
