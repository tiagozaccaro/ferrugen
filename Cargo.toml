[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/web",
  "apps/desktop",
  "apps/mobile",
  "apps/worker",
  "apps/admin-cli",
  "crates/platform-core",
  "crates/contracts",
  "crates/domain",
  "crates/application",
  "crates/auth",
  "crates/tenancy",
  "crates/authorization",
  "crates/audit",
  "crates/billing",
  "crates/i18n",
  "crates/persistence",
  "crates/storage",
  "crates/jobs",
  "crates/sync",
  "crates/integrations",
  "crates/api-client",
  "crates/ai",
  "crates/plugins",
  "crates/ui",
  "crates/design-system",
  "crates/infrastructure",
  "crates/test-support",
  "templates/ferrugen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ferrugen/ferrugen"
authors = ["Ferrugen Contributors"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dioxus = { version = "0.7", default-features = false }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
