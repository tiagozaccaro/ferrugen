name: Merge Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/github/check-pr-body.sh
      - name: Log guard result
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Merge-guard: pass for PR ${PR_NUMBER}" >> merge-guard-log.md
