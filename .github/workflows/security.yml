name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny
        run: cargo deny check
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.2 --locked
      - name: cargo audit
        # Documented out-of-scope upstream unpatched rsa (RUSTSEC-2023-0071 / 0.9.10) and rand (RUSTSEC-2026-0097).
        # See specs/001-platform-foundation/validation.md and PR #120; PR remains mergeable regardless.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
