name: Backup Tag Before Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  backup:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create backup tag
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          TAG="pre-merge-${PR_NUMBER}-$(git rev-parse --short HEAD)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created $TAG"
