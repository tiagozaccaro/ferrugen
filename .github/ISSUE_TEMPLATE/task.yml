name: Bounded implementation task
description: One small, testable task
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include negative/security cases and exact verification commands.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: In scope / out of scope
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and architectural constraints
