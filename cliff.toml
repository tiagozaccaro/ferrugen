# git-cliff configuration for Ferrugen releases.
#
# Releases are generated from commit messages (Conventional Commits preferred).
# Non-conventional commits are kept under "Other" rather than dropped, so a
# release never silently loses a change.
#
# Usage: scripts/release.sh <version>

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html). Dates use ISO 8601 (`YYYY-MM-DD`).

<!-- git-cliff: end of header -->
"""
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.breaking %} **(BREAKING)**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
require_conventional = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
fail_on_unmatched_commit = false
sort_commits = "oldest"
tag_pattern = 'v[0-9]+\.[0-9]+\.[0-9]+.*'
commit_parsers = [
  { message = "^[Mm]erge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^security", group = "Security" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^remove", group = "Removed" },
  { message = "^revert", group = "Reverted" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Chores" },
  { message = ".*", group = "Other" },
]
